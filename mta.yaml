_schema-version: 3.3.0
ID: SentinelGRC
version: 1.0.0
description: SentinelGRC – SAP GRC Security Platform

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:

  # ── CAP Backend (Node.js) ────────────────────────────────────────
  - name: SentinelGRC-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: sentinelgrc-xsuaa
      - name: sentinelgrc-hana-db
      - name: sentinelgrc-destination

  # ── HANA DB Deployer ─────────────────────────────────────────────
  - name: SentinelGRC-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: sentinelgrc-hana-db

  # ── App Router ───────────────────────────────────────────────────
  - name: SentinelGRC-approuter
    type: approuter.nodejs
    path: app/router
    parameters:
      memory: 256M
      disk-quota: 512M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: sentinelgrc-xsuaa

resources:

  # ── XSUAA ────────────────────────────────────────────────────────
  - name: sentinelgrc-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

  # ── HANA Cloud ───────────────────────────────────────────────────
  - name: sentinelgrc-hana-db
    type: org.cloudfoundry.managed-service
    parameters:
      service: hana
      service-plan: hdi-shared

  # ── Destination Service (for S/4HANA connectivity) ───────────────
  - name: sentinelgrc-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
