_schema-version: 3.3.0
ID: SentinelGRC
version: 1.0.0
description: SentinelGRC – SAP GRC Security Platform
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - sh -c "rm -rf app/router/webapp && mkdir -p app/router/webapp && cp -r webapp/. app/router/webapp/ && npm ci && npx cds build --production"
modules:
  # ── CAP Backend (Node.js) ────────────────────────────────────────
  - name: SentinelGRC-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: sentinelgrc-xsuaa
      - name: sentinelgrc-hdi
      - name: sentinelgrc-destination
      - name: sentinelgrc-connectivity
      - name: sentinelgrc-logging

  # ── HANA DB Deployer ─────────────────────────────────────────────
  - name: SentinelGRC-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: sentinelgrc-hdi

  # ── App Router ───────────────────────────────────────────────────
  - name: SentinelGRC-approuter
    type: approuter.nodejs
    path: app/router
    parameters:
      memory: 256M
      disk-quota: 512M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: sentinelgrc-xsuaa
      - name: sentinelgrc-logging

resources:
  # ── XSUAA ────────────────────────────────────────────────────────
  - name: sentinelgrc-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

  # ── Destination Service ──────────────────────────────────────────
  - name: sentinelgrc-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  # ── HDI Container ────────────────────────────────────────────────
  - name: sentinelgrc-hdi
    type: org.cloudfoundry.existing-service

  # ── Connectivity Service (for SCC/on-premise) ────────────────────
  - name: sentinelgrc-connectivity
    type: org.cloudfoundry.existing-service

  # ── Cloud Logging Service ────────────────────────────────────────
  - name: sentinelgrc-logging
    type: org.cloudfoundry.existing-service

  # ── Credential Store — REMOVED 2026-08-10 ────────────────────────
  # The free plan allows one instance per subaccount and dev/QAS/PROD share
  # one, so the service could never be created in QAS or PROD and every
  # transport failed. The Jira token comes from JIRA_TOKEN / JIRA_EMAIL in
  # the app environment instead. srv/lib/credential-store.js is still in the
  # tree and getJiraConfig() still prefers the service when one is bound, so
  # re-enabling later means restoring this resource and the requires entry
  # on SentinelGRC-srv — nothing else.