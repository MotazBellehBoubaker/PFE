_schema-version: 3.3.0
ID: SentinelGRC
version: 1.0.0
description: SentinelGRC – SAP GRC Security Platform
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - sh -c "rm -rf app/router/webapp && mkdir -p app/router/webapp && cp -r webapp/. app/router/webapp/ && npm ci && npx cds build --production"
modules:
  # ── CAP Backend (Node.js) ────────────────────────────────────────
  - name: SentinelGRC-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: sentinelgrc-xsuaa
      - name: sentinelgrc-hdi
      - name: sentinelgrc-destination
      - name: sentinelgrc-connectivity

  # ── HANA DB Deployer ─────────────────────────────────────────────
  - name: SentinelGRC-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: sentinelgrc-hdi

  # ── App Router ───────────────────────────────────────────────────
  - name: SentinelGRC-approuter
    type: approuter.nodejs
    path: app/router
    parameters:
      memory: 256M
      disk-quota: 512M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: sentinelgrc-xsuaa

resources:
  # ── XSUAA ────────────────────────────────────────────────────────
  - name: sentinelgrc-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

  # ── HANA Cloud ───────────────────────────────────────────────────
  - name: sentinelgrc-hana-db
    type: org.cloudfoundry.existing-service

  # ── Destination Service ──────────────────────────────────────────
  - name: sentinelgrc-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  # ── HDI Container ────────────────────────────────────────────────
  - name: sentinelgrc-hdi
    type: org.cloudfoundry.existing-service

  # ── Connectivity Service (for SCC/on-premise) ────────────────────
  - name: sentinelgrc-connectivity
    type: org.cloudfoundry.existing-service
